<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-more</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=5">

    <!-- Font Awesome（Instagramアイコン用） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">T-more</a>

            <button class="hamburger" id="hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="nav">
                <a href="index.html" class="active">Home</a>
                <a href="menu.html">Menu</a>
                <a href="flavor.html">Flavor Guide</a>
                <a href="access.html">Access</a>
            </nav>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero fade-in">
        <div class="hero-content">
            <p class="hero-eyebrow">Shisha bar</p>
            <h1>T-more</h1>
            <p>カジュアルに楽しめるシーシャバー</p>
        </div>
    </section>

    <!-- Concept -->
    <section class="concept fade-in">
    <h2>Concept</h2>
    <p>
        仕事終わりにふらっと立ち寄れる、
        シーシャ好きのためのシーシャバー。
    </p>
    </section>

    <!-- Gallery -->
    <section class="gallery fade-in">
        <h2>Gallery</h2>
        <div class="gallery-grid">
            <img src="images/hero.jpg" alt="店内写真" class="gallery-item">
            <img src="images/shisha.jpg" alt="シーシャ写真" class="gallery-item">
            <img src="images/counter.jpg" alt="カウンター" class="gallery-item">
        </div>
    </section>

    <!-- Access -->
    <section class="access fade-in">
        <h2>Access</h2>
        <div class="access-card">
            <div class="access-row">
                <span class="label">住所</span>
                <span class="value">神奈川県横浜市鶴見区生麦3丁目2-26 いい友ビル2F</span>
            </div>
        
            <div class="access-row">
                <span class="label">最寄駅</span>
                <span class="value">生麦駅 徒歩1分</span>
            </div>

            <div class="access-row">
                <span class="label">営業時間</span>
                <span class="value">
                    火〜日：15:00〜23:00(LO.22:00)<br>
                </span>
            </div>

            <div class="access-row">
                <span class="label">定休日</span>
                <span class="value">月曜日</span>
            </div>

            <div class="access-row">
                <span class="label">支払い方法</span>
                <span class="value">現金 / クレジットカード / 各種QR決済</span>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-inner">
            <a href="https://www.instagram.com/shisha.tmore/"
            target="_blank"
            rel="noopener noreferrer"
            class="sns-icon">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <p>&copy; 2026 T-more</p>
        </div>
    </footer>

    <script src="js/script.js?v=5"></script>

</body>
</html>
